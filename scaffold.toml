# Why each entry is what it is: docs/SCAFFOLD.md — not here, because every
# `lgs basecamp` verb rewrites this file and deletes every comment in it.

[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "35d8df0d031315219f94d1546ceb862b0e5b208f"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "1db7c5f8af3165318f9046c13ab185e24773fd59"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "aa237766baf61404e12da86b7303cb41065464c9"
build = "nix-flake"
attr = "app"

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "d3af2972f51d9c542537d80d60ad8d20282ddcd1"
build = "nix-flake"
attr = "cli"

[modules.delivery_module]
flake = "github:logos-co/logos-delivery-module/b8b9ac2f4667bc63644b2116f64a07aa30cfd3ef#lgx"
role = "dependency"

[modules.dialectica]
flake = "path:./dialectica#lgx"
role = "project"

[modules.dialectica_ui]
flake = "path:./dialectica-ui#lgx"
role = "project"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.1"

[basecamp.env]
QT_FORCE_STDERR_LOGGING = "1"
QT_LOGGING_RULES = "qt.qml.import.debug=true"

[basecamp.profiles.alice]
runtime_dir = "/run/user/1000"

[basecamp.profiles.bob]
runtime_dir = "/run/user/1000"
