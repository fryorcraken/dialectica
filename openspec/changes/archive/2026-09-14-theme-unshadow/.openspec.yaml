# `schema` is REQUIRED for this file to be valid change metadata, and without it
# `skip_specs` is silently NOT HONOURED — `openspec validate --strict` reports
# the marker as ignored and then fails for having no deltas, which reads as two
# problems rather than one. It must name a known schema; this project's is the
# built-in `spec-driven`, set in `openspec/config.yaml`.
schema: spec-driven

# No spec delta: this change renames a QML singleton so the host cannot shadow
# it. Every token keeps its name, its value and its meaning; the only thing that
# changes is the identifier the view reaches them through.
#
# `openspec validate` rejects a zero-delta change without this marker, and the
# marker is the honest answer rather than a workaround. The behaviour being
# restored — the view renders with the supplied design — is not contracted
# anywhere in `openspec/specs/`, and this change is not the place to write that
# contract: a requirement invented so validation passes would describe an
# implementation detail (what our singleton is called) rather than the system.
skip_specs: true
