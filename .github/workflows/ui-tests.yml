name: UI tests

# Runs the sitometres end-to-end specs against a real Basecamp: real clicks
# through the QML inspector, the real module transport, and the real
# `dialectica` core module against a real on-disk store.
#
# Kept out of ci.yml on purpose: it builds Basecamp from source (see below),
# where every job in ci.yml is seconds to a few minutes. The CHEAP half of this
# suite — parsing every spec against the harness schema — is a job in ci.yml
# (`ui-specs`), because it needs no Basecamp and catches a malformed spec on
# every PR in seconds.
#
# ─── why Basecamp is BUILT and not fetched ──────────────────────────────────
# sitometres attaches to Basecamp's QML inspector. That is a COMPILE-TIME
# feature and it is off in every shipping build, so a released artefact cannot
# be used and Basecamp is built from source.
#
# The target is `#app`, the DEV build. The inspector is off in the SHIPPING
# outputs (`appDistributed` passes `enableInspector = false`), not off in the
# dev build — and this job asserts that rather than trusting it, so a future
# Basecamp flipping the flag fails loudly instead of silently removing the
# thing this layer depends on. See "The build really has the QML inspector".
#
# ─── what this job does NOT do, and why it matters here ─────────────────────
# It never calls `lgs basecamp setup`. That is worth stating rather than
# leaving to be inferred: CLAUDE.md records that ANY `lgs basecamp` verb
# rewrites `scaffold.toml` and strips every comment in it — a plain
# `lgs basecamp modules`, which reads like a query, once deleted 77 lines. A
# workflow calling `setup` would silently delete this repo's most
# trap-carrying file on every run. `build` touches neither the basecamp
# binaries nor the profiles, and `lgs basecamp docs` names CI as a supported
# hand-authored `[modules.*]` case.

on:
  push:
    branches: [main]
  # On PRs from the start, rather than push-only first. Radicle's equivalent
  # was push-only on an assumption that measured false — ~3m warm, with the
  # cold cost dominated by pulling the closure rather than compiling — and
  # moved to `pull_request` afterwards. Dialectica's specs need no seed node
  # and no network for their assertions, so the variance is lower than
  # radicle's was, and re-running that experiment would only rediscover an
  # answer already written down.
  #
  # Two cases still pay the cold price and are worth knowing rather than being
  # surprised by: a PR from a FORK gets its own isolated cache scope, and the
  # first run after `[repos.basecamp].pin` changes, since the rev is in the key.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec:
    name: sitometres ${{ matrix.spec }} spec
    runs-on: ubuntu-latest
    # A backstop against a pathological cold run, not an estimate. Basecamp's
    # own doctests use the same figure for the same from-source build.
    timeout-minutes: 120

    # One job per spec. They share the expensive prefix — the Basecamp build —
    # but that is served from the store cache once the first warms it.
    #
    # THE MATRIX IS THE ONE HAND-MAINTAINED LIST HERE, and it is the shape that
    # goes stale silently: a spec added to the tree and not to this list runs
    # nowhere, passes nothing, and is indistinguishable from a spec that
    # passes. Radicle sat in exactly that state, with `SPEC` hardcoded to one
    # file and three specs running nowhere. The `every spec is in the matrix`
    # step below closes it: it globs the directory and fails when the two
    # disagree, so the list cannot rot without saying so.
    #
    # fail-fast is off: when two specs break, both are worth seeing, and one
    # failing for an environmental reason must not hide a real failure in
    # another.
    strategy:
      fail-fast: false
      matrix:
        spec: [join]

    env:
      # NOTE: BASECAMP_REV is NOT set here. It is derived from
      # `[repos.basecamp].pin` in scaffold.toml by the "Resolve the pinned
      # Basecamp rev" step below, which exports it for every later step.
      #
      # Hardcoding it here would make this a SECOND source of truth for one
      # fact, and the failure is silent: bump scaffold.toml and forget this,
      # and the store cache keys on the old rev, restores a store full of the
      # previous Basecamp, finds nothing useful in it and recompiles from
      # scratch on every run, forever. Nothing errors; the specs still pass;
      # the job just quietly costs minutes it should not, and CI slowness gets
      # blamed on the runners.
      SPEC: dialectica-ui/tests/ui/${{ matrix.spec }}.yaml

      # Where `lgs basecamp build --variant lgx` collects the modules.
      # sitometres takes ONE --app-dir search root, and both the core and the
      # UI .lgx must be findable from it.
      #
      # The DEV directory, not portable — matching the dev `#app` host.
      APP_DIR: .scaffold/basecamp/lgx

      # Kept in step with ci.yml's build job, and released rather than a git
      # rev. ci.yml explains at length why dialectica does not need the
      # unreleased rev radicle once pinned; this job does not change that,
      # because it calls no `setup` and wants no `--inspector` flag.
      LGS_VERSION: "0.3.1"

      # Pin the VERSION, never a range or `latest`: a moving ref would silently
      # change the tool that gates every spec here.
      #
      # A published release, not a git commit. Radicle pins a commit only to
      # work around an inspector-probe bug that affected the BUNDLE — the
      # released probe looked for `bin/.LogosBasecamp` and nix's dirBundler
      # ships `bin/.LogosBasecamp.elf`. The dev `#app` this job runs ships the
      # spelling the released probe has always looked for, so that bug is not
      # on this path at all.
      SITOMETRES: "@paradoxcomputer/sitometres@0.1.2"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Two unrelated needs, one apt transaction:
      #
      #   * the graphics libraries Basecamp resolves at load time. It carries
      #     its own Qt but NOT host graphics — you cannot bundle a GPU driver —
      #     so a bare runner dies with `libOpenGL.so.0: cannot open shared
      #     object file`.
      #   * `tomlq`, which the next step uses to read the Basecamp pin. That is
      #     why this sits up here rather than beside the build it also serves:
      #     the resolve step needs it, and the cache step needs the resolve
      #     step.
      #
      # `yq` is the PYTHON package that ships `tomlq`. The runner preinstalls a
      # `yq` already, but that is the Go one (v4) and has no `tomlq` — two
      # different tools sharing a name, so this install is not redundant.
      #
      # The runner image preconfigures third-party apt repos this job does not
      # use, and one of them failing takes `apt-get update` — and so the whole
      # job — down with it. Every package below comes from Ubuntu's own
      # archive, so the extra sources are moved aside by pattern rather than by
      # naming one file: the image's layout is not a contract, and a `.list`
      # that has become a deb822 `.sources` would make a targeted `rm` silently
      # do nothing.
      #
      # `update` is then allowed to fail without failing the step: `install` is
      # the real gate and fails loudly if a package cannot be resolved.
      - name: Install graphics runtime libraries and tomlq
        run: |
          set -eu
          sudo mkdir -p /etc/apt/disabled-sources.d
          # `find -exec` rather than a glob: no match must not be an error.
          sudo find /etc/apt/sources.list.d -maxdepth 1 \
            \( -name '*.list' -o -name '*.sources' \) \
            ! -name 'ubuntu.sources' ! -name 'ubuntu.list' \
            -exec mv -v -t /etc/apt/disabled-sources.d {} +
          sudo apt-get update -qq \
            || echo "::warning::apt-get update reported errors; install is the gate, continuing"
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 libegl1 libglu1-mesa libvulkan1 yq
          tomlq --version

      # Every spec file in the tree must be in the matrix above. A spec that is
      # not runs nowhere and passes nothing, which is indistinguishable from a
      # spec that passes — the exact state radicle was in with three specs
      # sitting outside its matrix.
      #
      # This runs in every matrix job rather than in one of its own: it needs
      # no build, costs milliseconds, and a separate job would be a second
      # place for the list to be wrong.
      - name: Every spec in the tree is in the matrix
        env:
          # THE WHOLE MATRIX, not this job's own entry. `matrix.spec` is the
          # single name this job runs, and comparing the directory against that
          # would report every OTHER spec as missing. `strategy.job-total` is
          # the count the matrix actually expands to, which is the number the
          # directory must match.
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -eu
          test -f "$SPEC" || {
            echo "::error::$SPEC does not exist — the matrix names a spec the tree does not have"
            exit 1
          }
          # Counting is the whole check, and it is sound in both directions
          # because the step above proves THIS job's name exists in the tree:
          # run across all N jobs, every matrix name is proven present, so N
          # distinct names are accounted for. If the directory then holds more
          # than N files, at least one runs nowhere.
          #
          # A count rather than a name-by-name comparison because the matrix is
          # not available to a job as a list — only this job's own entry is —
          # and a hand-copied second list beside it would be the very staleness
          # this check exists to catch.
          found=$(find dialectica-ui/tests/ui -maxdepth 1 -name '*.yaml' | wc -l)
          test "$found" -eq "$JOB_TOTAL" || {
            echo "::error::dialectica-ui/tests/ui holds $found spec(s) but the matrix expands to $JOB_TOTAL job(s)"
            echo "::error::a spec outside the matrix runs nowhere and passes nothing — add it to ui-tests.yml"
            find dialectica-ui/tests/ui -maxdepth 1 -name '*.yaml'
            exit 1
          }
          echo "ok: $found spec(s), $JOB_TOTAL matrix job(s)"

      # ONE source of truth for the Basecamp rev: `[repos.basecamp].pin`.
      #
      # Load-bearing because the store cache is keyed on what this exports: a
      # cache keyed on a rev the build does not use restores a store that
      # cannot help, and the only symptom is that every run is slow.
      #
      # Ordering: AFTER the apt step, which installs tomlq, and BEFORE the
      # cache step, which keys on what this writes.
      - name: Resolve the pinned Basecamp rev
        run: |
          set -eu
          pin=$(tomlq -r '.repos.basecamp.pin' scaffold.toml)
          # A short, empty or branch-name pin would still produce a perfectly
          # usable cache key while silently not being the rev anyone meant.
          # `tomlq -r` also prints the string "null" for a missing key, which
          # this rejects along with the rest.
          #
          # Lowercase is required rather than merely conventional: the pin goes
          # into the cache key verbatim, so `AA23…` and `aa23…` would key two
          # separate caches for one rev. Rejecting beats normalising, because
          # scaffold builds whatever the file says and only the file decides.
          printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::[repos.basecamp].pin is '$pin', expected a full 40-char lowercase sha"
            exit 1
          }
          echo "BASECAMP_REV=$pin" >> "$GITHUB_ENV"
          echo "BASECAMP_REV=$pin (from scaffold.toml)"

      # SHA-pinned, and `install_url` pins the NIX VERSION for the reason
      # ci.yml's build job documents at length: the UI module CANNOT build on
      # Nix <= 2.24, because `dialectica-ui/flake.nix` declares a relative path
      # input and old Nix rejects the lock file before any override applies.
      # Bisected there: 2.22.4 and 2.24.14 fail, 2.26.4 and 2.28.5 succeed.
      #
      # If this is ever lowered, build `dialectica-ui` — not just `dialectica`
      # — at the candidate version first.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          nix_path: nixpkgs=channel:nixos-unstable
          # The logos substituter is anonymously readable, so no token is
          # needed. Set here rather than relying on the flake's own nixConfig:
          # a flake's extra-substituters is only honoured for a trusted user
          # and is otherwise skipped with "ignoring untrusted flake
          # configuration setting". install-nix-action makes the runner user
          # trusted, so putting it in nix.conf makes it apply unconditionally.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
            accept-flake-config = true

      # What actually makes a repeat run fast. Most of the cold cost is not the
      # Basecamp compile but pulling its closure from the substituters, and the
      # cache removes the download rather than the compile. Keyed on the pinned
      # rev — the same rev the build uses — so bumping the pin starts a fresh
      # cache rather than restoring a store that cannot help.
      #
      # `env.BASECAMP_REV` here resolves against the accumulated step
      # environment, so it does see the $GITHUB_ENV write above.
      #
      # v7, not v5: on v5 this step never cached anything, failing restore with
      # a 400 from the retired legacy cache API and save with tar exit 2 on
      # root-owned daemon state. v7 runs tar under sudo, excludes that state,
      # and checkpoints the store's SQLite WAL before saving.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Both flakes have locks committed, so the locks are what the key
          # needs; the .nix files are included too, since a flake.nix change
          # that does not move the lock still changes what is built.
          primary-key: nix-ui-${{ runner.os }}-${{ env.BASECAMP_REV }}-${{ hashFiles('dialectica/flake.nix', 'dialectica/flake.lock', 'dialectica-ui/flake.nix', 'dialectica-ui/flake.lock') }}
          restore-prefixes-first-match: nix-ui-${{ runner.os }}-${{ env.BASECAMP_REV }}-
          # Keeps the cache from growing without bound across runs.
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-ui-${{ runner.os }}-
          purge-created: 604800

      # Cache the BINARY, not `~/.cargo` — same reasoning as ci.yml's pair of
      # steps: `cargo install` builds in a throwaway target dir, so caching the
      # registry saves only the download, and caching all of `~/.cargo/bin`
      # would overlay this runner image's cargo/rustc shims onto a future one.
      # Exact-match key with no restore-keys, deliberately.
      - name: Cache lgs
        id: lgs-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/lgs
          key: lgs-${{ runner.os }}-${{ env.LGS_VERSION }}

      # Gated on the cache miss rather than using `--force`: a plain
      # `cargo install` over an existing binary exits 101.
      - name: Install logos-scaffold
        if: steps.lgs-cache.outputs.cache-hit != 'true'
        run: cargo install logos-scaffold --version ${{ env.LGS_VERSION }} --locked

      # `--basecamp` points straight at the nix out-link; nothing is copied.
      # The `-o` out-link is the ONLY reason a raw `nix build` appears here:
      # `lgs` has no verb that builds a Basecamp attr without also running
      # `setup`'s profile seeding, and this job must not call `setup` — see the
      # header for why that matters more in this repo than in radicle's.
      #
      # The rev comes from BASECAMP_REV, which the resolve step read from
      # `[repos.basecamp].pin` — still the one place it is written.
      - name: Build Basecamp (dev, inspector included)
        run: |
          set -eu
          nix build "github:logos-co/logos-basecamp/$BASECAMP_REV#app" \
            -o result-basecamp --accept-flake-config
          bin="$PWD/result-basecamp/bin/LogosBasecamp"
          test -x "$bin"
          echo "BASECAMP_BIN=$bin" >> "$GITHUB_ENV"

      # The inspector must actually be in there. Without this the failure is
      # sitometres refusing the binary several steps later — or worse, a future
      # Basecamp flipping `enableInspector` off for `#app` and this job
      # silently losing the thing it exists to test.
      #
      # Same needle sitometres greps for, against the sibling ELF the nix
      # wrapper execs. Do NOT point `--basecamp` at that ELF directly: it
      # clears the probe and then fails to spawn with ENOENT, because the
      # wrapper is what sets the library and Qt plugin paths. The wrapper is
      # the binary; the dot-file is what the probe needs to find BESIDE it.
      - name: The build really has the QML inspector
        run: |
          set -eu
          elf="$(dirname "$BASECAMP_BIN")/.LogosBasecamp"
          test -f "$elf" || {
            echo "::error::no .LogosBasecamp beside the wrapper — has the nix output layout changed?"
            exit 1
          }
          grep -aq "\[QmlInspector\] Inspector server listening on port" "$elf" || {
            echo "::error::#app has no QML inspector compiled in — sitometres cannot drive it"
            exit 1
          }
          echo "ok: inspector present"

      # `.#lgx` — the DEV variant, matching the dev Basecamp above. THE TWO
      # HALVES MUST AGREE: a dev Basecamp accepts `linux-amd64-dev` modules and
      # a portable bundle accepts `[linux-x86_64, linux-amd64]`. Mismatch them
      # and Basecamp declines to load the module with one warning line —
      #
      #   Warning: module 'dialectica' … was installed for variant '<x>' which
      #   is not supported on this platform and will not be loadable
      #
      # — after which the UI opens to nothing and the spec times out on its
      # first step, with no hint in sitometres' own output as to why. That is
      # the failure this pairing exists to avoid, and it is SYMMETRICAL: either
      # half alone reproduces it.
      #
      # `lgs basecamp build` builds both modules in dependency order, derives
      # the `--override-input dialectica path:../dialectica` itself by parsing
      # dialectica-ui/flake.nix, and collects the results into ONE directory —
      # which is what sitometres needs, since --app-dir is a single search root.
      - name: Build both modules (dev)
        run: lgs basecamp build --variant lgx

      # `lgs basecamp build` is a build and should touch nothing else, but
      # CLAUDE.md's rule is that ANY `lgs basecamp` verb may rewrite
      # scaffold.toml and strip its comments — a plain `modules`, which reads
      # like a query, once deleted 77 lines. So this asserts it rather than
      # trusting it. The pin this job's cache key derives from lives in that
      # file, so a silent rewrite here would be expensive and invisible.
      - name: lgs left scaffold.toml alone
        run: |
          set -eu
          git diff --exit-code scaffold.toml || {
            echo "::error::lgs basecamp build rewrote scaffold.toml — see CLAUDE.md's module contract traps"
            exit 1
          }

      # sitometres reads $APP_DIR directly: it follows the /nix/store symlinks
      # and is not confused by the <NN>- load-order prefix, the two details
      # most likely to have broken it. There is deliberately NO copy into a
      # dist/ directory — `lgs basecamp build` already does the collecting.
      - name: Run the spec
        # Bounded well inside the job's 120, so a spec that hangs fails HERE,
        # leaving the later steps to collect logs and upload evidence. If the
        # job-level timeout fires instead it kills the whole run, artifacts and
        # all, and there is nothing left to look at.
        timeout-minutes: 30
        run: |
          # pipefail is load-bearing: without it the `| tee` below makes the
          # step's exit status tee's, which is always 0, so a failing run would
          # report as a pass.
          set -euo pipefail
          mkdir -p ui-results ui-results/screenshots
          # --strict: an INCONCLUSIVE run is one that proved nothing, and a
          # green tick on no evidence is worse than a red one. Without it
          # sitometres exits 0 on INCONCLUSIVE by design.
          #
          # No --variant: sitometres' hostVariant() default is
          # `linux-amd64-dev`, which is exactly what `.#lgx` produces. An
          # override here would BREAK the pairing rather than establish it — it
          # was only ever needed for the portable bundle.
          npx --yes "$SITOMETRES" run "$SPEC" \
            --app dialectica_ui \
            --app-dir "$APP_DIR" \
            --basecamp "$BASECAMP_BIN" \
            --strict \
            --json  "ui-results/${{ matrix.spec }}.json" \
            --junit "ui-results/${{ matrix.spec }}.xml" \
            --artifacts ui-results/screenshots \
            2>&1 | tee ui-results/sitometres.log

      # The exit code is the primary gate; this asserts against the MACHINE
      # REPORT, because the terminal summary is styled for a human and carries
      # no stable field to match on, while --json is written from a `finally`
      # on every exit path.
      #
      # Three things must hold: the verdict is a pass, every step in the report
      # passed, and the step count matches the spec. The last is what stops a
      # run that opened the app, did nothing else and reported a clean sheet
      # from reading as a pass. The adjudicator is a checked-in script with its
      # own tests (tst_adjudicate_ui_run.py) rather than a heredoc, so it can
      # be run — and its guards proven — without pushing a branch.
      - name: The run proved what the spec asks
        # `always()` so the per-step breakdown is printed even when the run step
        # already failed — that listing is usually the fastest way to see which
        # step broke. It cannot rescue a failed run: this step only ever adds a
        # failure, never removes one.
        if: always()
        run: |
          set -eu
          # Explicit rather than assumed: the runner image happens to ship
          # PyYAML, but this check is the gate and must not depend on that.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 dialectica-ui/tests/adjudicate-ui-run.py \
            "ui-results/${{ matrix.spec }}.json" "$SPEC"

      # Basecamp's own log is the only record of what the app did — QML errors,
      # module load failures, the calls the view dispatched. sitometres runs
      # against a throwaway user-dir and reaps it on exit, so this only catches
      # anything when the process was killed rather than exiting cleanly; it is
      # best-effort by nature, hence the `|| true`.
      - name: Collect Basecamp logs
        if: failure()
        run: |
          set -eu
          mkdir -p ui-results/logs
          find "${TMPDIR:-/tmp}" -maxdepth 3 -type f -name 'basecamp_*.log' \
            -path '*sitometres*' -exec cp {} ui-results/logs/ \; 2>/dev/null || true
          ls -la ui-results/logs || true
          [ -n "$(ls -A ui-results/logs 2>/dev/null)" ] \
            || echo "no basecamp log survived — sitometres reaps its user-dir on exit"

      # On failure only: this is the evidence needed to diagnose a red run, and
      # there is nothing to look at when it is green.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per spec: upload-artifact refuses a name another job in the same run
          # already claimed, so a shared name would fail every job but one.
          name: ui-test-evidence-${{ matrix.spec }}
          path: ui-results/
          if-no-files-found: warn
